[package]
name = "mujoco-sys"
description = "The vendored MuJoCo 3.11.0 runtime engine and libccd, compiled by cc (wasi-sdk clang for wasm32-wasip2, the host toolchain natively), plus the raw mjw_* accessor shim. The safe wrapper is `mujoco`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "Apache-2.0 AND BSD-3-Clause"
links = "mujoco_engine"

[build-dependencies]
cc = "1.2"

# FFI: unsafe is this crate's whole job, so it doesn't take the workspace's
# deny.
[lints.clippy]
all = { level = "warn", priority = -1 }
