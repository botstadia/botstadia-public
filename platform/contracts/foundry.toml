# BotStadia's contracts: Results, Settlement and Standing orders, plus local
# stand-ins. Immutable once deployed (TRUST.md#admin-powers): a change in
# logic is a redeploy, never an upgrade.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Batches and pools read a lot of state in one place; the IR pipeline compiles
# that without hand-shuffling locals to dodge the stack.
via_ir = true
bytecode_hash = "none"
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./test/fixtures" }]
remappings = [
    "forge-std/=lib/forge-std/src/",
    "openzeppelin/=lib/openzeppelin-contracts/contracts/",
    # RISC Zero's verifier contracts at their release tag; they import
    # OpenZeppelin by its package root.
    "risc0/=lib/risc0-ethereum/contracts/src/",
    "lib/risc0-ethereum/:openzeppelin/=lib/openzeppelin-contracts/",
]

# What `forge test` (and so `task test` and CI) runs: short enough that the
# suite takes seconds. `FOUNDRY_PROFILE=deep forge test` soaks.
[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 200
fail_on_revert = false

[profile.deep.fuzz]
runs = 10_000

[profile.deep.invariant]
runs = 512
depth = 1000
fail_on_revert = false

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "params_first_multi"
quote_style = "double"
number_underscore = "thousands"
sort_imports = true
