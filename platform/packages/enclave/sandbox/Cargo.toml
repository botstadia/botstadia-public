[package]
name = "botstadia-sandbox"
description = "The session runner's Linux-only seat isolation: namespaces, a seccomp filter and core affinity. Elsewhere every call reports it's unsupported, so nothing pretends to isolate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.30", default-features = false, features = ["sched", "resource"] }
seccompiler = "0.5"
libc = "0.2"

# The local runner's CPU-time read (`process_cpu_ns`), so a seat on a busy
# Mac is timed by what it ran, as on Linux.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[lints]
workspace = true
