[package]
name = "botstadia-host"
description = "BotStadia's session host: an arena and its seats on wasmtime, fuel budgets per budget version, ONNX inference with fixed charges, bundles, and the replay archive and metrics out. The one host the CLI, botstadia-train and the enclave share."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
botstadia-interface = { workspace = true, features = ["host", "bundle"] }
bytes = "1"
futures = "0.3.31"
ort = { workspace = true }
prost = "0.14"
rand = { version = "0.10.1", default-features = false, features = ["std_rng"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { version = "1.47", features = ["rt", "time", "test-util"] }
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
zip = { version = "9", default-features = false, features = ["deflate"] }

[lints]
workspace = true

[dev-dependencies]
wat = "1"
