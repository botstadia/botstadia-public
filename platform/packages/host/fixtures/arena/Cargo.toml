[package]
name = "botstadia-host-fixture-arena"
description = "A tiny arena for the session host's tests: two seats each send a value every turn for twenty turns."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
botstadia-interface = { workspace = true, features = ["arena-guest"] }
serde_json = { workspace = true }
